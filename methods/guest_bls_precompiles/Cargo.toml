[package]
name = "guest_bls_precompiles"
version = "0.1.0"
edition = "2021"

[dependencies]
risc0-zkvm = { version = "3.0.4", default-features = false, features = [
    'std',
] }
proving_service_core = { path = "../../core" }

serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
base64 = "0.21"

# RISC Zero precompile versions
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
# blst patch applied at workspace level (both host and guest use it)
blst = { version = "=0.3.14", default-features = false, features = ["no-threads"] }
